<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CubaseMixAI</title>
<style>:root{color-scheme:dark}*{box-sizing:border-box}body{font:16px system-ui;background:#0d1422;color:#e7eef8;max-width:1120px;margin:auto;padding:24px}h1{letter-spacing:-1px}p{line-height:1.6;color:#b4c6df}section,article{background:#152138;border:1px solid #30435e;border-radius:12px;padding:22px;margin:20px 0}input,select,textarea,button{font:inherit;padding:11px;border:1px solid #4b6285;border-radius:6px;background:#0d1728;color:inherit}input,textarea,select{width:100%;max-width:100%}section,article,main,form{min-width:0}h3{overflow-wrap:anywhere}@media(max-width:600px){body{padding:12px}section,article{padding:14px}button{max-width:100%;white-space:normal}}textarea{min-height:95px}label{display:block;margin:14px 0 6px}button{cursor:pointer;margin:8px 8px 0 0;background:#254f80}button:disabled{opacity:.5}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px;padding:12px;background:#0a1220;max-height:500px;overflow:auto}input[type=checkbox]{width:auto}.danger{background:#813b30}.muted{font-size:14px}.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}#message{color:#ffce86}a{color:#81baff}</style>
<h1>CubaseMixAI</h1><p>분석 → 제안 → 직접 검토·승인 → 적용 → 재렌더 비교</p>
<section><label for="token">로컬 실행 터미널에 표시된 승인 토큰</label><input id="token" type="password" autocomplete="off"><p class="muted">토큰은 브라우저 메모리에만 유지됩니다. 프로젝트를 별도 폴더로 백업하고 현재 Cubase 값과 매핑을 직접 확인하세요.</p></section>
<section><h2>분석 및 작업</h2><label for="operation">수행할 작업</label><select id="operation"></select><form id="form"><div id="fields"></div><button id="run">실행</button></form><p id="message" role="status"></p><details open><summary>작업 결과</summary><pre id="result">로컬 파일 경로를 입력하세요. WAV나 프로젝트는 서버로 업로드되지 않습니다.</pre></details><button id="download">결과 JSON 저장</button></section>
<section><div class="row"><h2>변경안 검토와 적용</h2><button id="auto" aria-pressed="false">Auto 켜기</button><button id="refresh">목록 새로고침</button></div><p>Auto를 켜면 이 탭이 열려 있는 동안 새로 생성된 변경안을 순서대로 적용합니다. 기존 변경안은 승인 및 적용을 누르세요.</p><main id="list"></main></section>
<script>
const token=document.querySelector('#token'),message=document.querySelector('#message'),result=document.querySelector('#result');
const definitions={
remote_propose_reference_volumes:{label:'레퍼런스 스템 기준 트랙 페이더 묶음 제안',fields:[['track_pairs','트랙 identity/tag와 현재·레퍼런스 WAV 경로 목록 (JSON)','json','[]'],['max_track_step_db','트랙별 최대 이동량 (dB)','number','1'],['reason','변경 이유','text','레퍼런스 스템과 비교한 첫 단계']]},
remote_propose_master_peak:{label:'렌더 WAV 피크 기준 마스터 페이더 제안',fields:[['target','remote_tracks에서 받은 master target','json','{}'],['object_id','실제 master fader object ID','number','0'],['parameter_tag','remote_inspect에서 받은 Volume tag','number','0'],['master_wav','트랙 변경 후 Cubase에서 새로 렌더한 WAV'],['target_peak_db','출력 피크 목표 (dBFS)','number','-6'],['peak_metric','sample_peak_dbfs 또는 true_peak_estimate_dbtp','text','sample_peak_dbfs'],['max_step_db','최대 fader 이동량 (dB)','number','3']]},
remote_status:{label:'Cubase 15 연결·API 기능 확인',fields:[]},
remote_tracks:{label:'Cubase 15 실제 트랙 목록',fields:[]},
remote_inspect:{label:'Cubase 15 대상 파라미터 조회',fields:[['target','트랙 목록에서 받은 target 객체','json','{}'],['object_id','조회할 object ID (정수)','number','0']]},
remote_propose:{label:'Cubase 15 실제 값 기반 변경안',fields:[['target','트랙 목록에서 받은 target 객체','json','{}'],['object_id','파라미터 object ID','number','0'],['parameter_tag','실제 parameter tag','number','0'],['after','목표 값','number','0'],['value_kind','plain 또는 normalized','text','plain'],['unit','호스트가 반환한 단위','text','dB'],['max_delta','최대 이동량','number','1'],['reason','변경 이유','text','작은 변경을 A/B 청취'] ]},
compare:{label:'믹스 / 레퍼런스 분석',fields:[['mix','믹스 WAV'],['reference','레퍼런스 WAV']]},
compare_sections:{label:'후렴·드롭 구간 비교',fields:[['mix','믹스 WAV'],['reference','레퍼런스 WAV'],['sections','구간 설정 (JSON)','json','[{"name":"chorus","start":0,"end":10,"reference_start":0,"reference_end":10}]']]},
analyze_stems:{label:'킥·808·보컬·기타 스템 분석',fields:[['stems','스템 경로 (JSON)','json','{"kick":"C:/audio/kick.wav","808":"C:/audio/808.wav"}']]},
clap_compare:{label:'AI 청취 비교',fields:[['mix','믹스 WAV (0.4–30초)'],['reference','레퍼런스 WAV (0.4–30초)'],['model_dir','설치된 CLAP 모델 폴더']]},
propose_reference:{label:'레퍼런스 기반 변경안 생성',fields:[['mix','믹스 WAV'],['reference','레퍼런스 WAV'],['mapping_path','실측 매핑 JSON'],['current_values','직접 확인한 현재 값 (JSON)','json','{"master.volume":0}'],['target','제어 대상 이름','text','master'],['mode','mix 또는 master','text','mix']]},
backup_project:{label:'저장·종료한 Cubase 프로젝트 백업',fields:[['project_dir','원본 프로젝트 폴더'],['destination','새 백업 폴더 (기존 폴더 불가)']]},
verify_backup:{label:'백업 파일 검증',fields:[['backup_dir','백업 폴더']]},
restore_project:{label:'새 폴더에 프로젝트 복원',fields:[['backup_dir','백업 폴더'],['destination','새 복원 폴더 (기존 폴더 불가)']]},
calibration_report:{label:'캘리브레이션 오차 확인',fields:[['mapping_path','실측 매핑 JSON'],['observations','독립 측정 결과 (JSON)','json','[{"control":"vocal.volume","requested":-2,"observed":-2.1,"tolerance":0.2}]']]},
master_chain:{label:'마스터 체인 매핑 점검',fields:[['mapping_path','실측 매핑 JSON'],['target','마스터 제어 대상 이름','text','master']]},
create_render_job:{label:'Cubase 재렌더 작업 준비',fields:[['before','변경 전 WAV'],['reference','레퍼런스 WAV'],['output','Cubase에서 내보낼 새 WAV 경로']]},
finish_render_job:{label:'완료된 재렌더 가져오기',fields:[['job_id','재렌더 작업 ID']]},
evaluate_render:{label:'변경 전후 / 레퍼런스 비교',fields:[['before','변경 전 WAV'],['after','변경 후 WAV'],['reference','레퍼런스 WAV']]},
export_ab:{label:'레벨을 맞춘 A/B 청취 파일 만들기',fields:[['first','A WAV'],['second','B WAV'],['destination','새 A/B 출력 폴더']]}
};
const select=document.querySelector('#operation');for(const [key,d] of Object.entries(definitions)){const o=document.createElement('option');o.value=key;o.textContent=d.label;select.append(o)}
function fields(){const root=document.querySelector('#fields');root.replaceChildren();for(const [key,label,type,initial] of definitions[select.value].fields){const l=document.createElement('label');l.htmlFor='f-'+key;l.textContent=label;const i=document.createElement(type==='json'?'textarea':'input');i.id='f-'+key;i.dataset.key=key;i.dataset.type=type||'text';i.value=initial||'';i.required=true;root.append(l,i)}}select.onchange=fields;fields();
async function api(path,body){const r=await fetch(path,{method:body?'POST':'GET',headers:{'X-Review-Token':token.value,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});const d=await r.json();if(!r.ok)throw Error(typeof d.detail==='string'?d.detail:JSON.stringify(d.detail));return d}
let lastResult=null;function show(data){lastResult=data;result.textContent=JSON.stringify(data,null,2)}
document.querySelector('#form').onsubmit=async e=>{e.preventDefault();const b=document.querySelector('#run');b.disabled=true;message.textContent='처리 중…';try{const body={};for(const i of document.querySelectorAll('#fields input,#fields textarea'))body[i.dataset.key]=i.dataset.type==='json'?JSON.parse(i.value):i.dataset.type==='number'?Number(i.value):i.value;show(await api('/run/'+select.value,body));message.textContent='완료. 결과의 제한 사항과 다음 작업을 확인하세요.';await refresh()}catch(e){message.textContent=e.message}finally{b.disabled=false}};
document.querySelector('#download').onclick=()=>{if(!lastResult)return;const url=URL.createObjectURL(new Blob([JSON.stringify(lastResult,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='cubasemixai-report.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
async function refresh(){try{const data=await api('/history');const list=document.querySelector('#list');list.replaceChildren();for(const p of data){const box=document.createElement('article'),title=document.createElement('h3'),pre=document.createElement('pre');title.textContent=p.id+' · '+p.status;pre.textContent=JSON.stringify(p.payload,null,2);box.append(title,pre);const button=(label,fn,danger=false)=>{const b=document.createElement('button');b.textContent=label;if(danger)b.className='danger';b.onclick=async()=>{b.disabled=true;try{show(await fn());await refresh()}catch(e){message.textContent=e.message;b.disabled=false}};box.append(b)};
if(p.status==='pending'){
    button('승인 및 적용',()=>approveAndApply(p.id),true);
    button('거절',()=>api('/decision/'+p.id,{approve:false}));
}
button('MIDI 미리보기',()=>api('/apply/'+p.id,{dry_run:true}));
if(p.status==='approved')button('적용',()=>api('/apply/'+p.id,{dry_run:false,confirmed:true}),true);
if(['sent','uncertain','sending','verified'].includes(p.status)&&p.payload.kind!=='plugin')button('복원 변경안 생성 (재승인 필요)',()=>api('/restore/'+p.id,{}));list.append(box)}}catch(e){message.textContent=e.message}}
async function approveAndApply(id){
    await api('/decision/'+id,{approve:true,confirmed:true});
    return api('/apply/'+id,{dry_run:false,confirmed:true});
}
const autoButton=document.querySelector('#auto');
let generation=0;
function stopAuto(){
    generation++;
    autoButton.setAttribute('aria-pressed','false');
    autoButton.textContent='Auto 켜기';
}
autoButton.onclick=async()=>{
    if(autoButton.getAttribute('aria-pressed')==='true'){stopAuto();return}
    autoButton.disabled=true;
    try{
        const {since}=await api('/auto/start',{});
        const run=++generation;
        autoButton.setAttribute('aria-pressed','true');
        autoButton.textContent='Auto 끄기';
        const attempted=new Set();
        async function poll(){
            if(run!==generation)return;
            try{
                const pending=await api('/auto/pending?since='+encodeURIComponent(since));
                for(const id of pending){
                    if(run!==generation)return;
                    if(attempted.has(id))continue;
                    attempted.add(id);
                    show(await approveAndApply(id));
                    message.textContent='자동 적용 완료';
                    await refresh();
                }
                if(run===generation)setTimeout(poll,1000);
            }catch(e){
                if(run===generation){stopAuto();message.textContent='자동 적용 중지 · '+e.message;await refresh()}
            }
        }
        poll();
    }catch(e){message.textContent=e.message}
    finally{autoButton.disabled=false}
};
token.addEventListener('input',stopAuto);
document.querySelector('#refresh').onclick=refresh;
</script></html>
