[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cubasemixai"
version = "0.1.0"
description = "Local WAV analysis and approval-gated Cubase Generic Remote control"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "scipy>=1.12,<2", "soundfile>=0.12,<1", "pyloudnorm>=0.1.1,<1", "mido>=1.3,<2", "python-rtmidi>=1.5,<2", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "mcp>=1.12,<2"]

[project.optional-dependencies]
ai = ["laion-clap==1.1.7", "torch>=2.2", "torchaudio>=2.2"]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]

[project.scripts]
cubasemixai = "cubasemixai.cli:main"
cubasemixai-mcp = "cubasemixai.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
