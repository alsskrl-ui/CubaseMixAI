[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cubasemixai"
version = "0.4.0"
description = "Local mix analysis, approved Cubase control and expressive MIDI generation"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "scipy>=1.12,<2", "soundfile>=0.12,<1", "pyloudnorm>=0.1.1,<1", "mido>=1.3,<2", "python-rtmidi>=1.5,<2", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "mcp>=1.12,<2", "pywin32>=306; sys_platform == 'win32'"]

[project.optional-dependencies]
ai = ["transformers>=4.46,<5", "torch>=2.6,<3", "librosa>=0.10,<1", "huggingface-hub>=0.26,<1"]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]
browser = ["playwright>=1.50,<2"]

[project.scripts]
cubasemixai = "cubasemixai.cli:main"
cubasemixai-mcp = "cubasemixai.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
cubasemixai = ["*.html", "remote/*.js"]
